services:
  dns-updater:
    restart: unless-stopped
    build:
      context: ./src
      dockerfile: Dockerfile
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID}

      # Use one of:
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      # AZURE_CLIENT_SECRET_FILE: /run/secrets/azure_client_secret

    volumes:
      # Mount your dns.json config here. The file is read AND written
      # (state is stored back into it after each update cycle).
      - ./dns.json:/config/dns.json

    # Optional: pass extra flags to the entrypoint
    # command: ["--interval", "900", "--ttl", "3600", "--log-level", "DEBUG"]

#   secrets:
#     - azure_client_secret

# secrets:
#   azure_client_secret:
#     file: ./secrets/azure_client_secret.txt
